{% extends 'admin_panel/base.html' %}
{% block title %}Services{% endblock %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
    <h1 class="h2">Services</h1>
    <a href="{% url 'admin_panel:service_add' %}" class="btn btn-primary">Add Service</a>
</div>

<div class="card card-list">
  <div class="card-body p-3">
    <div class="table-responsive">
      <table class="table table-hover mb-0">
        <thead>
          <tr>
            <th>Title</th>
            <th>Active</th>
            <th class="text-end">Actions</th>
          </tr>
        </thead>
        <tbody>
          {% for s in services %}
            <tr>
              <td>{{ s.title }}</td>
              <td>{% if s.is_active %}<span class="badge bg-success">Active</span>{% else %}<span class="text-muted">No</span>{% endif %}</td>
              <td class="text-end">
                <a href="{% url 'admin_panel:service_edit' s.pk %}" class="btn btn-sm btn-outline-primary">Edit</a>
                <a href="{% url 'admin_panel:service_delete' s.pk %}" class="btn btn-sm btn-outline-danger">Delete</a>
              </td>
            </tr>
          {% empty %}
            <tr><td colspan="3" class="text-muted">No services yet.</td></tr>
          {% endfor %}
        </tbody>
      </table>
    </div>
  </div>
</div>
{% endblock %}
