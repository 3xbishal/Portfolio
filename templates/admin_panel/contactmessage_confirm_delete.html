{% extends 'admin_panel/base.html' %}
{% block title %}Delete Message{% endblock %}
{% block content %}
<h1 class="h4 mb-3">Delete Message</h1>
<p class="text-muted">Are you sure you want to delete the message from <strong>{{ object.name }}</strong> with subject <strong>{{ object.subject }}</strong>?</p>
<form method="post">
    {% csrf_token %}
    <a href="{% url 'admin_panel:contactmessage_list' %}" class="btn btn-outline-secondary">Cancel</a>
    <button type="submit" class="btn btn-danger">Delete</button>
</form>
{% endblock %}
