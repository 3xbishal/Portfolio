{% extends 'admin_panel/base.html' %}
{% block title %}Delete Education{% endblock %}
{% block content %}
<h1 class="h4 mb-3">Delete Education</h1>
<p class="text-muted">Are you sure you want to delete the education entry <strong>{{ object.degree }} at {{ object.institution }}</strong>?</p>
<form method="post">
    {% csrf_token %}
    <a href="{% url 'admin_panel:education_list' %}" class="btn btn-outline-secondary">Cancel</a>
    <button type="submit" class="btn btn-danger">Delete</button>
</form>
{% endblock %}
