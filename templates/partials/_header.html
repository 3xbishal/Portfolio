{% load static %}
<!-- Header -->
<header class="header">
    <nav class="navbar navbar-expand-lg navbar-light bg-transparent">
        <div class="container">
            <a class="navbar-brand d-flex align-items-center" href="{% url 'home' %}">
                <div class="brand-avatar d-flex align-items-center justify-content-center me-2">
                    {% if profile and profile.logo %}
                        <img src="{{ profile.logo.url }}" alt="{{ company_name }}" class="img-fluid" style="max-height: 40px; max-width: 40px; object-fit: contain;">
                    {% else %}
                        <i class="fas fa-building"></i>
                    {% endif %}
                </div>
                <div>
                    <span class="brand-title">{{ company_name|default:'My Portfolio' }}</span>
                    {% if profile and profile.title %}
                        <small class="brand-subtitle">{{ profile.title }}</small>
                    {% endif %}
                </div>
            </a>

            <!-- Nav controls (particle toggle + dark mode) - visible on desktop -->
            <div class="navbar-center d-none d-lg-flex align-items-center gap-2">
                <button type="button" id="animatedBgToggle" class="nav-toggle-btn"
                        aria-label="Toggle animated background" aria-pressed="true"
                        title="Remove animated background">
                    <i class="fas fa-magic"></i>
                </button>
                <button type="button" id="darkModeToggle" class="nav-toggle-btn"
                        aria-label="Toggle dark mode" aria-pressed="false"
                        title="Toggle dark mode">
                    <i class="fas fa-moon"></i>
                </button>
            </div>

            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
                    aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse justify-content-end" id="navbarNav">
                <ul class="navbar-nav align-items-lg-center">
                    <li class="nav-item">
                        <a class="nav-link{% if request.resolver_match.url_name == 'home' %} active{% endif %}"
                           href="{% url 'home' %}">Home</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link{% if request.resolver_match.url_name == 'about' %} active{% endif %}"
                           href="{% url 'about' %}">About</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link{% if request.resolver_match.url_name == 'projects' or request.resolver_match.url_name == 'project_detail' %} active{% endif %}"
                           href="{% url 'projects' %}">Projects</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link{% if request.resolver_match.url_name == 'contact' %} active{% endif %}"
                           href="{% url 'contact' %}">Contact</a>
                    </li>
                    <!-- Mobile nav controls (inside collapsed menu) -->
                    <li class="nav-item d-lg-none">
                        <hr class="dropdown-divider my-2">
                        <div class="d-flex gap-2 px-3 py-2">
                            <button type="button" id="animatedBgToggleMobile" class="nav-toggle-btn"
                                    aria-label="Toggle animated background" aria-pressed="true"
                                    title="Remove animated background">
                                <i class="fas fa-magic"></i>
                            </button>
                            <button type="button" id="darkModeToggleMobile" class="nav-toggle-btn"
                                    aria-label="Toggle dark mode" aria-pressed="false"
                                    title="Toggle dark mode">
                                <i class="fas fa-moon"></i>
                            </button>
                            <span class="small text-muted align-self-center ms-1">Toggle background & dark mode</span>
                        </div>
                    </li>
                </ul>
            </div>
        </div>
    </nav>
</header>
