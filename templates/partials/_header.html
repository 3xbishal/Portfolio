{% with url_name=request.resolver_match.url_name %}
<header class="site-header" id="siteHeader">
    <nav class="navbar navbar-expand-md" aria-label="Main navigation">
        <div class="container">
            <a class="brand" href="{% url 'home' %}">
                {% if profile and profile.logo %}
                    <img src="{{ profile.logo.url }}" alt="" class="brand-logo" width="32" height="32">
                {% endif %}
                <span>{% if profile %}{{ profile.company|default:profile.name }}{% else %}{{ site_name }}{% endif %}</span>
            </a>

            <div class="header-actions order-md-last ms-auto ms-md-3">
                <button type="button" id="themeToggle" class="icon-btn" aria-label="Switch to dark theme" title="Dark theme">
                    <i class="fas fa-moon" aria-hidden="true"></i>
                </button>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav"
                        aria-controls="mainNav" aria-expanded="false" aria-label="Open menu">
                    <span class="navbar-toggler-icon"></span>
                </button>
            </div>

            <div class="collapse navbar-collapse justify-content-md-end" id="mainNav">
                <ul class="navbar-nav align-items-md-center">
                    <li class="nav-item">
                        <a class="nav-link{% if url_name == 'home' %} active{% endif %}" href="{% url 'home' %}"
                           {% if url_name == 'home' %}aria-current="page"{% endif %}>Home</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link{% if url_name == 'projects' or url_name == 'project_detail' %} active{% endif %}" href="{% url 'projects' %}"
                           {% if url_name == 'projects' %}aria-current="page"{% endif %}>Projects</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link{% if url_name == 'about' or url_name == 'experience_detail' %} active{% endif %}" href="{% url 'about' %}"
                           {% if url_name == 'about' %}aria-current="page"{% endif %}>About</a>
                    </li>
                    <li class="nav-item ms-md-2">
                        <a class="btn btn-primary btn-sm nav-cta" href="{% url 'contact' %}"
                           {% if url_name == 'contact' %}aria-current="page"{% endif %}>Contact me</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>
</header>
{% endwith %}
